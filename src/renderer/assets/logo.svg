<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Reboxed: a record (white ring) with the play head in its gap, and the box at its centre. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d8dff"/>
      <stop offset="1" stop-color="#1473eb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="123" fill="none" stroke="#ffffff" stroke-width="54" stroke-linecap="round"
    stroke-dasharray="682.8 90" transform="rotate(-24 256 256)"/>
  <circle cx="343" cy="169" r="17" fill="url(#accent)"/>
  <rect x="208" y="208" width="96" height="96" rx="16" fill="url(#accent)"/>
</svg>
